

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saleha Haider | Portfolio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { margin: 0; color: #2c3e50; font-size: 2.5em; }
        .subtitle { color: #7f8c8d; font-size: 1.2em; margin-top: 10px; }
        
        .section-title { font-size: 1.5em; margin: 40px 0 20px; border-left: 5px solid #3498db; padding-left: 15px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #fff; border: 1px solid #eee; border-radius: 12px; overflow: hidden; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img, .card video { width: 100%; display: block; }
        .card-info { padding: 15px; text-align: center; font-weight: bold; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Saleha Haider</h1>
        <p class="subtitle">Artificial Intelligence Student | Design & Automation Intern</p>
    </header>

    <div class="section-title">Design Projects (Canva)</div>
    <div class="grid">
        <div class="card"><img src="MONSTER.png"><div class="card-info">Monster Energy Branding</div></div>
        <div class="card"><img src="PORCHE.png"><div class="card-info">Porsche Ad Design</div></div>
        <div class="card"><img src="REFRESH.png"><div class="card-info">Refreshing Drink Mockup</div></div>
        <div class="card"><img src="blend.png"><div class="card-info">Creative Blend Poster</div></div>
        <div class="card"><img src="hair oil.png"><div class="card-info">Product Branding</div></div>
    </div>

    <div class="section-title">Video & Motion Work</div>
    <div class="grid">
        <div class="card">
            <video controls>
                <source src="SWEET.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="card-info">SWEET Motion Graphics</div>
        </div>
    </div>
</div>

</body>
</html>
